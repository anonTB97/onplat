name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger. Also the only way to start a run for commits pushed with an
  # app/installation token: GitHub deliberately does not raise `push` events for
  # those, to stop workflows recursing on their own commits.
  workflow_dispatch:

# A warning is a build failure — enforced from the first commit, because
# retrofitting a lint across a codebase is how standards die.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      # --locked on every cargo invocation: the build must use exactly the
      # committed Cargo.lock, or fail. A resolver that quietly picks a newer
      # transitive version in CI is a supply-chain door left open.
      - name: clippy (all targets, all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # Default features only — this also proves the demo/test tree builds and
      # passes without sqlx, which is the dependency-minimalism claim in
      # docs/production-posture.md made checkable.
      - name: test
        run: cargo test --locked --workspace

  leak-tests:
    name: cross-tenant leak tests are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Fails if an endpoint was added to the route inventory without
      # regenerating its leak test.
      - name: leak-test codegen up to date
        run: cargo run --locked -p xtask -- gen-leak-tests --check
      - name: run leak tests
        run: cargo test --locked -p wadl-api --test generated_leak_test

  fixtures:
    name: sample P6 export is internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A schedule fixture nobody checks rots into a plausible-looking file that
      # teaches a parser the wrong lessons. This also asserts the two conditions
      # the sample carries on purpose are still there, so it cannot quietly stop
      # covering the ground it claims to.
      - name: validate the sample P6 export
        run: python3 scripts/validate-p6-sample.py

  wasm:
    name: pure crates build for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The engine and the planning math must stay free of tokio/sqlx/std::time.
      # If a dependency creeps in that breaks the wasm build, this job fails —
      # which is exactly what it exists to catch.
      - name: build engine for wasm
        run: cargo build --locked -p wadl-engine --target wasm32-unknown-unknown
      - name: build planning math for wasm
        run: cargo build --locked -p wadl-plan --target wasm32-unknown-unknown
      # Mitigation options are counterfactual engine verdicts, so they must be
      # computable where the engine is — including in a browser at the compartment
      # door with no network on the ship.
      - name: build mitigation options for wasm
        run: cargo build --locked -p wadl-mitigate --target wasm32-unknown-unknown
      # Issues are joins of the register against the engine; the same offline
      # reasoning applies to "can this execute as planned" as to "what opens it".
      - name: build issue derivation for wasm
        run: cargo build --locked -p wadl-issues --target wasm32-unknown-unknown

  migrations:
    name: migrations + RLS on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: apply migrations via the CLI
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo run --locked -p wadl-cli -- migrate
      - name: seed the demo world
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo run --locked -p wadl-cli -- seed
      # The queries under test carry no org_id clause — the database supplies the
      # filter — so a dropped or mis-written policy fails here and nowhere else.
      # The pg seam is behind wadl-store's `postgres` feature; this job is one
      # of the two sanctioned consumers (the CLI above is the other).
      - name: prove row-level security on a real database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p wadl-store --features postgres --test pg_rls

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sbom:
    name: SBOM (SPDX) artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The software bill of materials an accreditation package inventories —
      # generated from the lockfiles (cargo + npm) on every push so the SBOM
      # is a build product, not a document someone writes after the fact.
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: wadl-sbom.spdx.json

  air-gap:
    name: vendored offline build rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # An air-gapped enclave build must be a rehearsed procedure, not a first
      # attempt: vendor every dependency from the lockfile, cut the network
      # off (--offline), and prove the deploy tree still compiles. Default
      # features on purpose — this rehearses building the artifact that ships.
      - name: vendor dependencies
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor >> .cargo/config.toml
      - name: build offline from the vendor directory
        run: cargo check --locked --offline --workspace

  reproducible:
    # Two full release builds per run is too slow for every push; run it on
    # demand (workflow_dispatch) before cutting a release artifact.
    if: github.event_name == 'workflow_dispatch'
    name: release build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: build once
        run: |
          cargo build --locked --release -p wadl-api --bin serve
          sha256sum target/release/serve | tee first.sum
      - name: build again from clean
        run: |
          cargo clean
          cargo build --locked --release -p wadl-api --bin serve
          sha256sum target/release/serve | tee second.sum
      - name: hashes must match
        run: |
          cut -d' ' -f1 first.sum > a; cut -d' ' -f1 second.sum > b
          diff a b && echo "reproducible: $(cat a)"

  web:
    name: shell typecheck · unit tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell-web/package-lock.json
      - run: npm ci
      - name: typecheck
        # -b follows the project references, so vite.config.ts (the node
        # project) is checked with the same command `npm run build` uses.
        run: npx tsc -b
      # The camera invariants (cursor-fixed wheel zoom, both views) used to be
      # guarded by one-off browser scripts; a browser script proves the build it
      # ran against, these prove every build after it too.
      - name: unit tests
        run: npx vitest run
      - name: build
        run: npx vite build
