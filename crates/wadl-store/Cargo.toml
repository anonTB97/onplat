[package]
name = "wadl-store"
description = "Repositories and read models. Owns the tenant session scope and every SQL statement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# PostgreSQL is a deployment concern, not a library concern: only the binaries
# that actually open a database (wadl-cli, serve's `postgres` feature) opt in.
# Everything else — the demo server, the API tests, the shell's whole backend —
# compiles without sqlx and its ~90-crate transitive tree. Smaller attack
# surface to scan, smaller SBOM to justify, faster builds.
[features]
default = []
postgres = ["dep:sqlx", "dep:serde_json"]

[dependencies]
wadl-domain.workspace = true
wadl-engine.workspace = true
wadl-plan.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v7"] }
chrono.workspace = true
sqlx = { workspace = true, optional = true }
# The pg store's document payloads (ingested schedule/zones/budgets) and rule
# payloads travel as JSON; the demo store needs none of this.
serde_json = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
