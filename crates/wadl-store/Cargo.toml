[package]
name = "wadl-store"
description = "Repositories and read models. Owns the tenant session scope and every SQL statement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# PostgreSQL is a deployment concern, not a library concern: only the binaries
# that actually open a database (wadl-cli, serve's `postgres` feature) opt in.
# Everything else — the demo server, the API tests, the shell's whole backend —
# compiles without sqlx and its ~90-crate transitive tree. Smaller attack
# surface to scan, smaller SBOM to justify, faster builds.
[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
wadl-domain.workspace = true
wadl-engine.workspace = true
wadl-plan.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v7"] }
chrono.workspace = true
sqlx = { workspace = true, optional = true }
# Document payloads travel as JSON on PostgreSQL, and since S13 two of the
# read models are JSON by contract on both stores (the field map a run was
# read through and the survey of the file — the store never depends on the
# ingest crate, so it holds them as values). Already in every binary through
# wadl-api; the featureless tree gains nothing new.
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# The ledger tests parse a JSON export written by the build before chain
# format 2, exactly as `wadl verify-ledger` is handed one.
serde_json.workspace = true

[lints]
workspace = true
